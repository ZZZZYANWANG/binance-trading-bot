name: statphys-sensemble-research

on:
  push:
    branches:
      - research/statphys-sensemble-20261119
    paths:
      - ".github/workflows/statphys-sensemble-research.yml"
      - "research/statphys_sensemble/run_research.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    if: ${{ !contains(github.event.head_commit.message, '[skip research]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<3" "pandas>=2.2,<3" "scipy>=1.12,<2" "requests>=2.31,<3"
      - name: Apply pre-label availability fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("research/statphys_sensemble/run_research.py")
          text = path.read_text(encoding="utf-8")
          old = 'tr = train & panel[cols].notna().all(axis=1).to_numpy(); te = test & panel[cols].notna().all(axis=1).to_numpy()'
          new = 'tr = train & panel[[candidate, f"yraw{horizon}", f"ystd{horizon}"]].notna().all(axis=1).to_numpy(); te = test & panel[[candidate, f"yraw{horizon}", f"ystd{horizon}"]].notna().all(axis=1).to_numpy()'
          count = text.count(old)
          if count != 3:
              raise RuntimeError(f"expected three availability contracts, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Run s-ensemble and Doob-transform validation
        env:
          PYTHONHASHSEED: "0"
          SENSEMBLE_START: "2021-01"
          SENSEMBLE_END: "2026-10"
        run: python research/statphys_sensemble/run_research.py
      - name: Commit code fix and evidence to research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/statphys_sensemble/run_research.py research/statphys_sensemble/evidence
          if ! git diff --cached --quiet; then
            git commit -m "research: record s-ensemble validation evidence [skip research]"
            git push origin HEAD:research/statphys-sensemble-20261119
          fi
      - name: Upload evidence archive
        uses: actions/upload-artifact@v4
        with:
          name: statphys-sensemble-evidence
          path: research/statphys_sensemble/evidence
          if-no-files-found: error
          retention-days: 14
